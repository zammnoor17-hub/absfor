
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>X-Pray - Modern Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
            animation: {
              'mesh': 'meshMove 20s ease infinite alternate',
              'shimmer': 'shimmer 2s linear infinite',
            },
            keyframes: {
              meshMove: {
                '0%': { backgroundPosition: '0% 0%' },
                '100%': { backgroundPosition: '100% 100%' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              }
            }
          }
        }
      }
    </script>
    <style>
      .mesh-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: #f8fafc;
        background-image: 
          radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.1) 0px, transparent 40%),
          radial-gradient(circle at 90% 90%, rgba(99, 102, 241, 0.1) 0px, transparent 40%);
        background-size: 200% 200%;
      }
      .dark .mesh-bg {
        background-color: #020617;
        background-image: 
          radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.2) 0px, transparent 40%),
          radial-gradient(circle at 90% 90%, rgba(99, 102, 241, 0.2) 0px, transparent 40%);
      }
      .scan-line {
        height: 3px;
        background: linear-gradient(to right, transparent, #10b981, transparent);
        position: absolute;
        width: 100%;
        z-index: 10;
        animation: scanMove 2s ease-in-out infinite;
      }
      @keyframes scanMove {
        0% { top: 10%; opacity: 0; }
        50% { opacity: 1; }
        100% { top: 90%; opacity: 0; }
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      .dark .glass-card {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "qrcode": "https://esm.sh/qrcode@^1.5.4",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "framer-motion": "https://esm.sh/framer-motion@^11.0.0",
        "firebase/": "https://esm.sh/firebase@^12.7.0/",
        "xlsx": "https://esm.sh/xlsx@^0.18.5",
        "html5-qrcode": "https://esm.sh/html5-qrcode@^2.3.8"
      }
    }
    </script>
  </head>
  <body class="transition-colors duration-500 overflow-x-hidden">
    <div class="mesh-bg animate-mesh"></div>
    <div id="root"></div>
  </body>
</html>
